<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrownCAD Documents</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="page__header">
        <div>
          <p class="eyebrow">HUAYUN Secondary Dev</p>
          <h1>CrownCAD Documents</h1>
        </div>
        <button id="loginButton" type="button">OAuth2 Login</button>
      </header>

      <section class="toolbar">
        <input id="searchInput" type="search" placeholder="Search documents" />
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="draft">Draft</option>
          <option value="published">Published</option>
        </select>
        <button id="refreshButton" type="button">Refresh</button>
      </section>

      <section id="statusPanel" class="status-panel" aria-live="polite"></section>
      <section id="documentList" class="document-list"></section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
